<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Edge FX - Terminal Institucional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B0F17',
                        cardbg: '#111827',
                        cardborder: '#1F2937',
                        accentgreen: '#10B981',
                        accentred: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0F17; color: #F3F4F6; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0B0F17; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-view" class="fixed inset-0 z-50 flex items-center justify-center bg-darkbg p-4">
        <div class="w-full max-w-md glass-card rounded-2xl p-8 shadow-2xl border border-cardborder">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 bg-emerald-500/10 text-emerald-400 rounded-2xl mb-3 border border-emerald-500/20">
                    <i data-lucide="trending-up" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">MACRO EDGE FX</h1>
                <p class="text-xs text-slate-400 mt-1">Terminal Institucional de Macro Trading</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="trader@macroedge.com" class="w-full bg-slate-900/80 border border-cardborder rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-cardborder rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-all">
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.99] flex items-center justify-center gap-2">
                    ACCEDER A LA TERMINAL <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div id="login-error" class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl text-center font-medium">
                Credenciales inválidas. Verifica tu correo y contraseña.
            </div>
        </div>
    </div>

    <!-- TERMINAL PRINCIPAL -->
    <div id="app-view" class="hidden flex-1 flex flex-col">
        
        <!-- HEADER ESTILO TERMINAL FINANCIERA -->
        <header class="glass-card sticky top-0 z-40 border-b border-cardborder px-6 py-3">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-slate-950 font-black shadow-md">
                        M
                    </div>
                    <div>
                        <span class="text-sm font-bold tracking-wide text-white block">MACRO EDGE FX</span>
                        <span class="text-[10px] text-emerald-400 font-mono">LIVE FEED CONNECTED</span>
                    </div>
                </div>

                <!-- RELOJ UTC Y SESIONES DE MERCADO -->
                <div class="flex items-center gap-6 text-xs font-mono">
                    <div class="bg-slate-900/80 px-3 py-1.5 rounded-lg border border-cardborder flex items-center gap-2">
                        <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                        <span id="utc-clock" class="text-white font-bold">00:00:00 UTC</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <span class="flex items-center gap-1.5 text-slate-400">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> LONDRES
                        </span>
                        <span class="flex items-center gap-1.5 text-slate-400">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> NUEVA YORK
                        </span>
                        <span class="flex items-center gap-1.5 text-slate-500">
                            <span class="w-2 h-2 rounded-full bg-slate-700"></span> TOKIO
                        </span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="logout()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-semibold rounded-lg border border-cardborder transition-all flex items-center gap-1.5">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Salir
                    </button>
                </div>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6 custom-scrollbar">

            <!-- 1. MATRIZ DE FUERZA DE DIVISAS (8 DIVISAS PRINCIPALES) -->
            <section>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="w-4 h-4 text-emerald-400"></i> MATRIZ DE FUERZA DE DIVISAS (CURRENCY STRENGTH METER)
                    </h2>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3" id="strength-matrix">
                    <!-- Generado dinámicamente -->
                </div>
            </section>

            <!-- 2. SIMULADOR DE NOTICIAS FOREX FACTORY (SANDBOX INTERACTIVO) -->
            <section class="glass-card rounded-2xl p-4 border border-cardborder">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-emerald-400"></i>
                        <h3 class="text-xs font-bold text-white uppercase tracking-wider">
