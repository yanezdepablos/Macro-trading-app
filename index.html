<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Edge FX - Terminal Institucional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B0F17',
                        cardbg: '#111827',
                        cardborder: '#1F2937',
                        accentgreen: '#10B981',
                        accentred: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0F17; color: #F3F4F6; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0B0F17; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-view" class="fixed inset-0 z-50 flex items-center justify-center bg-darkbg p-4">
        <div class="w-full max-w-md glass-card rounded-2xl p-8 shadow-2xl border border-cardborder">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 bg-emerald-500/10 text-emerald-400 rounded-2xl mb-3 border border-emerald-500/20">
                    <i data-lucide="trending-up" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">MACRO EDGE FX</h1>
                <p class="text-xs text-slate-400 mt-1">Terminal Institucional de Macro Trading</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Correo Electrónico</label>
                    <input type="email" id="email" value="yanezdepablos6@gmail.com" class="w-full bg-slate-900/80 border border-cardborder rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-900/80 border border-cardborder rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-all">
                </div>
                <!-- Botón con llamada directa onclick para evitar bloqueos -->
                <button type="button" id="btn-login" onclick="handleLoginDirect()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer">
                    ACCEDER A LA TERMINAL <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>

            <div id="login-error" class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl text-center font-medium"></div>
        </div>
    </div>

    <!-- TERMINAL PRINCIPAL -->
    <div id="app-view" class="hidden flex-1 flex flex-col">
        <header class="glass-card sticky top-0 z-40 border-b border-cardborder px-6 py-3">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-slate-950 font-black shadow-md">M</div>
                    <div>
                        <span class="text-sm font-bold tracking-wide text-white block">MACRO EDGE FX</span>
                        <span class="text-[10px] text-emerald-400 font-mono">LIVE FEED CONNECTED</span>
                    </div>
                </div>
                <div class="flex items-center gap-6 text-xs font-mono">
                    <div class="bg-slate-900/80 px-3 py-1.5 rounded-lg border border-cardborder flex items-center gap-2">
                        <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                        <span id="utc-clock" class="text-white font-bold">00:00:00 UTC</span>
                    </div>
                </div>
                <div>
                    <button onclick="logout()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-semibold rounded-lg border border-cardborder transition-all flex items-center gap-1.5">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Salir
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6 custom-scrollbar">
            <section>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="w-4 h-4 text-emerald-400"></i> MATRIZ DE FUERZA DE DIVISAS (CURRENCY STRENGTH METER)
                    </h2>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3" id="strength-matrix"></div>
            </section>

            <section class="glass-card rounded-2xl p-4 border border-cardborder">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-emerald-400"></i>
                        <h3 class="text-xs font-bold text-white uppercase tracking-wider">SIMULADOR DE ESCENARIOS FOREX FACTORY (SANDBOX)</h3>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="triggerScenario('USD_NFP_BULL')" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs rounded-xl border border-cardborder">USD NFP Supera Expectativas</button>
                    <button onclick="triggerScenario('EUR_CPI_BEAR')" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs rounded-xl border border-cardborder">EUR CPI Caída Fuerte</button>
                    <button onclick="resetScenarios()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs rounded-xl border border-cardborder ml-auto">Restablecer</button>
                </div>
            </section>

            <section class="glass-card rounded-2xl border border-cardborder overflow-hidden">
                <div class="p-4 border-b border-cardborder">
                    <h3 class="text-sm font-bold text-white tracking-wide">RANKING DE PARES MACRO (DELTA DIVERGENCIA)</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900/50 text-slate-400 uppercase font-mono border-b border-cardborder">
                            <tr>
                                <th class="p-3">Par</th>
                                <th class="p-3">Dirección</th>
                                <th class="p-3">Delta Macro</th>
                                <th class="p-3">Probabilidad</th>
                                <th class="p-3">Riesgo</th>
                            </tr>
                        </thead>
                        <tbody id="pairs-table-body" class="divide-y divide-cardborder/50 text-slate-300"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- SCRIPT -->
    <script>
        const SUPABASE_URL = 'https://mdirnmbtelplzcpcystce.supabase.co';
        const SUPABASE_KEY = 'ey3hbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ey3pc3VpOiJzdXBhYmFzZSIsInJlZiI6Im1kaXJubWJ0ZWxwbHpjcGN5c3RjZSIsInJvbGUiOiJhb24iLCJpYXQiOjE3MjY3Mjc5MTMsImV4cCI6MjA0MjMwNzkxM30.4iLClCYxIqjinjt9DTMuffMylgSLU4lHk8xsExFEqg0';

        let client = null;
        function getClient() {
            if (!client && window.supabase && window.supabase.createClient) {
                client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
            return client;
        }

        let currencies = {
            USD: { score: 7.8, status: 'Fuerte' },
            EUR: { score: 3.2, status: 'Débil' },
            GBP: { score: 6.1, status: 'Neutral' },
            JPY: { score: 2.4, status: 'Muy Débil' },
            AUD: { score: 5.5, status: 'Neutral' },
            CAD: { score: 6.8, status: 'Fuerte' },
            CHF: { score: 4.1, status: 'Débil' },
            NZD: { score: 4.8, status: 'Neutral' }
        };

        const pairsData = [
            { pair: 'USD/JPY', thesis: 'Divergencia Fed vs BoJ.' },
            { pair: 'EUR/USD', thesis: 'CPI Eurozona a la baja.' },
            { pair: 'GBP/USD', thesis: 'Lateralidad BoE.' },
            { pair: 'USD/CAD', thesis: 'Petróleo moderado.' }
        ];

        async function handleLoginDirect() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('login-error');
            const btn = document.getElementById('btn-login');
            
            errDiv.classList.add('hidden');
            btn.innerText = 'CONECTANDO...';

            const sb = getClient();
            if (!sb) {
                errDiv.textContent = 'Error: Supabase no disponible.';
                errDiv.classList.remove('hidden');
                btn.innerText = 'ACCEDER A LA TERMINAL →';
                return;
            }

            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) {
                    errDiv.textContent = 'Acceso Denegado: ' + error.message;
                    errDiv.classList.remove('hidden');
                    btn.innerText = 'ACCEDER A LA TERMINAL →';
                } else {
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('app-view').classList.remove('hidden');
                    renderMatrix();
                    renderPairs();
                }
            } catch (err) {
                errDiv.textContent = 'Error de red: ' + err.message;
                errDiv.classList.remove('hidden');
                btn.innerText = 'ACCEDER A LA TERMINAL →';
            }
        }

        function renderMatrix() {
            const container = document.getElementById('strength-matrix');
            if(!container) return;
            container.innerHTML = '';
            for (const [curr, info] of Object.entries(currencies)) {
                const percentage = (info.score / 10) * 100;
                const color = info.score >= 6 ? 'bg-emerald-500' : info.score <= 4 ? 'bg-red-500' : 'bg-amber-500';
                container.innerHTML += `
                    <div class="glass-card p-3 rounded-xl border border-cardborder flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-sm text-white">${curr}</span>
                            <span class="text-xs font-mono text-slate-400">${info.score.toFixed(1)}</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden mb-1">
                            <div class="${color} h-1.5 rounded-full" style="width: ${percentage}%"></div>
                        </div>
                        <span class="text-[10px] text-slate-500 uppercase tracking-wider">${info.status}</span>
                    </div>
                `;
            }
        }

        function renderPairs() {
            const tbody = document.getElementById('pairs-table-body');
            if(!tbody) return;
            tbody.innerHTML = '';
            pairsData.forEach(item => {
                const [base, quote] = item.pair.split('/');
                const delta = (currencies[base]?.score || 5) - (currencies[quote]?.score || 5);
                const dir = delta > 0.5 ? 'BUY' : delta < -0.5 ? 'SELL' : 'NEUTRAL';
                const prob = Math.min(95, Math.max(55, Math.round(50 + Math.abs(delta) * 8)));
                const risk = prob > 75 ? 'Bajo' : prob > 60 ? 'Medio' : 'Alto';
                const dirClass = dir === 'BUY' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/40">
                        <td class="p-3 font-bold text-white">${item.pair}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded border text-[10px] font-bold ${dirClass}">${dir}</span></td>
                        <td class="p-3 font-mono text-emerald-400">${delta > 0 ? '+' : ''}${delta.toFixed(1)}</td>
                        <td class="p-3 font-mono text-white">${prob}%</td>
                        <td class="p-3 text-slate-400">${risk}</td>
                    </tr>
                `;
            });
        }

        function logout() {
            location.reload();
        }

        setInterval(() => {
            const now = new Date();
            const clockEl = document.getElementById('utc-clock');
            if(clockEl) clockEl.textContent = now.toUTCString().split(' ')[4] + ' UTC';
        }, 1000);

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
